<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 배경 및 그림자 정의 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#3a2e2b" flood-opacity="0.15"/>
    </filter>
    <clipPath id="icon-clip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- 바탕 배경 (두번째 이미지 아이보리 톤 #FAF6F0) -->
  <rect width="512" height="512" rx="115" ry="115" fill="#FAF6F0"/>

  <!-- 아이콘 내부 구역 클리핑 -->
  <g clip-path="url(#icon-clip)">
    <!-- 티켓 그룹 (우측 하단 배치 & 그림자) -->
    <g filter="url(#shadow)" transform="translate(180, 140)">
      
      <!-- 맨 뒤 티켓 (가장 오른쪽/아래) -->
      <g transform="translate(100, 120) rotate(35) scale(0.85)">
        <rect x="0" y="0" width="160" height="260" rx="12" fill="#3D3A3A"/>
        <!-- 톱니 모양 상단 -->
        <path d="M 0 0 L 160 0" stroke="#FAF6F0" stroke-width="8" stroke-dasharray="10 6"/>
        <line x1="20" y1="200" x2="140" y2="200" stroke="#555" stroke-width="2" stroke-dasharray="4 4"/>
      </g>

      <!-- 중간 티켓 -->
      <g transform="translate(50, 60) rotate(20) scale(0.9)">
        <rect x="0" y="0" width="160" height="260" rx="12" fill="#8C3A3A"/>
        <path d="M 0 0 L 160 0" stroke="#FAF6F0" stroke-width="8" stroke-dasharray="10 6"/>
        <line x1="20" y1="200" x2="140" y2="200" stroke="#A84E4E" stroke-width="2" stroke-dasharray="4 4"/>
      </g>

      <!-- 맨 앞 티켓 (스파이더맨 티켓 느낌의 버건디/포인트 레드) -->
      <g transform="translate(0, 0) rotate(5)">
        <rect x="0" y="0" width="160" height="260" rx="12" fill="#C83737"/>
        <path d="M 0 0 L 160 0" stroke="#FAF6F0" stroke-width="8" stroke-dasharray="10 6"/>
        <!-- 티켓 디테일 라인 -->
        <circle cx="80" cy="100" r="28" fill="none" stroke="#E66B6B" stroke-width="3"/>
        <line x1="20" y1="200" x2="140" y2="200" stroke="#E66B6B" stroke-width="2" stroke-dasharray="4 4"/>
      </g>

    </g>
  </g>
</svg>
